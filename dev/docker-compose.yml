# nvfury Development Container
# Safe environment for patch development - does NOT install modules on host

services:
  nvfury-dev:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: nvfury-dev
    network_mode: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # Mount nvfury source
      - ..:/workspace/nvfury:rw
      # Mount Zig from host
      - /opt/zig-0.16.0-dev:/opt/zig-0.16.0-dev:ro
      # Mount kernel headers (read-only for safety)
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      # Separate build cache (not touching host)
      - nvfury-cache:/root/.cache/nvfury
    working_dir: /workspace/nvfury
    stdin_open: true
    tty: true
    user: root
    # Safety: no privileged mode, no host module access
    privileged: false

volumes:
  nvfury-cache:
